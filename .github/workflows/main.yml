name: Build and Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: >-
          platform-tools
          platforms;android-36
          build-tools;36.0.0
          ndk;21.4.7075529
          cmake;3.22.1

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build APK
      run: ./gradlew assembleRelease

    - name: Get version name
      id: get_version
      run: |
        VERSION_NAME=$(grep -m1 "versionName '" app/build.gradle | sed "s/.*versionName '\(.*\)'/\1/")
        TIMESTAMP=$(date +"%Y%m%d%H%M%S")
        echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
        echo "unique_tag=v${VERSION_NAME}-${TIMESTAMP}" >> $GITHUB_OUTPUT

    - name: Check build outputs
      run: |
        ls -la
        ls -la app/build/outputs/apk/
        ls -la app/build/outputs/apk/release/

    - name: Create Release and upload APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.unique_tag }}
        name: Release ${{ steps.get_version.outputs.unique_tag }}
        files: app/build/outputs/apk/release/*.apk
        draft: false
        prerelease: false
